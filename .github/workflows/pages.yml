# Deploys the site to GitHub Pages and stamps every deploy with its commit, so the editor can load
# files by version (see editor/index.html) and never mix old and new files. It also compiles the bundles (tools/build_bundle.py).
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Compile up front so the published site loads fast: the 40-odd stylesheets become one (tds/tds.css) and every component's
      # data becomes one file (tds/bundle.json). It rewrites those files in the deploy copy only; the repo keeps the sources.
      - name: Check layers and build the bundles
        run: |
          python3 tools/check_layers.py
          python3 tools/build_bundle.py --in-place .
      - name: Stamp version
        run: |
          V="${GITHUB_SHA::10}"
          echo "{\"v\":\"$V\"}" > version.json
          # version the stylesheets the preview pages pull in
          sed -i -E "s#(@import url\(\"[^\"]+\.css)\"#\1?v=$V\"#" tds/tds.css
          sed -i "s#\.\./tds/tds\.css#../tds/tds.css?v=$V#" preview/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
