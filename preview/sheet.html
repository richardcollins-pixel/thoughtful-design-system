<!doctype html>
<html lang="en" data-fidelity="styled">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDS sticker sheet</title>
  <link rel="stylesheet" href="../tds/tds.css">
  <style>
    /* canvas chrome only: a sticker sheet lists every element of a level, each with all of its variants */
    body { padding: var(--space-5, 20px) var(--space-8) var(--space-16); }
    body:not([data-ready]) > * { visibility: hidden; }
    main { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 50px; }
    .item { display: flex; flex-direction: column; gap: 20px; }
    .head { display: flex; flex-direction: column; gap: 10px; }
    .head button { all: unset; cursor: pointer; font-weight: 300; font-size: 26px; line-height: 1.2; }
    .head button:hover { text-decoration: underline; }
    .head p { opacity: .5; }
    iframe { display: block; width: 100%; border: 0; height: 120px; background: transparent; color-scheme: dark; overflow: hidden; }
  </style>
</head>
<body>
  <main id="sheet"></main>
  <script type="module">
    const q = new URLSearchParams(location.search), tier = q.get('tier'), ver = q.get('v');
    const { loadData } = await import('../tools/data.js' + (ver ? `?v=${ver}` : ''));
    const data = await loadData(ver);
    const paths = data.index.filter((c) => c.startsWith(tier + '/'));
    const metas = paths.map((p) => data.metas[p]);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    document.getElementById('sheet').innerHTML = paths.map((p, i) => `
      <section class="item" data-path="${p}">
        <div class="head"><button data-open="${p}" title="Open ${esc(metas[i].name)}">/${esc(p.split('/').pop())}</button><p class="text-body-md">${esc(metas[i].description || '')}</p></div>
        <iframe scrolling="no" title="${esc(metas[i].name)}" src="component.html?c=${p}&embed=1${ver ? `&v=${ver}` : ''}"></iframe>
      </section>`).join('');
    // Each element page tells us how tall it is; opening one asks the editor to show it on its own.
    addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'tds-height') { const f = [...document.querySelectorAll('iframe')].find((x) => x.contentWindow === e.source); if (f) f.style.height = `${Math.ceil(e.data.h)}px`; }
    });
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-open]'); if (b && self !== top) parent.postMessage({ type: 'tds-open', path: b.dataset.open }, location.origin); });
    document.body.dataset.ready = '';
  </script>
</body>
</html>
