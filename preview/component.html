<!doctype html>
<html lang="en" data-fidelity="styled">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDS component</title>
  <link rel="stylesheet" href="../tds/tds.css">
  <style>
    /* canvas chrome only */
    html { scrollbar-width: none; }   /* a screen scrolls, but a phone shows no scrollbar */
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body { padding: var(--page-gutter, var(--space-6)); }
    .label { margin-bottom: var(--space-2); }
    .embed { padding: 0; }
    .controls { display: grid; grid-template-columns: auto auto; column-gap: 40px; row-gap: var(--space-4); align-self: center; align-items: start; }
    .control-col { display: contents; }
    .control { display: flex; flex-direction: column; gap: var(--space-2); }
    .control label { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; }
    /* controls on the tiles are white on transparent: no blue, no dark fill */
    .controls input { appearance: none; margin: 0; width: 16px; height: 16px; flex: none; border: 1.5px solid rgba(255,255,255,.7); background: transparent; display: grid; place-items: center; cursor: pointer; }
    .controls input[type=radio] { border-radius: 50%; }
    .controls input[type=checkbox] { border-radius: 4px; }
    .controls input:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .controls input[type=checkbox]:checked::after { border-radius: 2px; }
    .controls input:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }
    /* designed sticker sheets (Figma "Mockups"): rounded tiles on the page, each with a caption */
    .st-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; }
    .st-tile { position: relative; display: flex; flex-direction: column; align-items: center; min-height: 230px; border-radius: var(--radius-md, 16px); background: var(--bg-elevation-5); overflow: hidden; }
    .st-tile .st-stage { flex: 1; padding: 28px 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 100%; }
    .st-tile .st-cap, .st-cap { padding-bottom: 14px; font: var(--text-body-sm); opacity: .7; }
    .st-hero { flex-direction: row; justify-content: center; gap: 40px; height: 358px; min-height: 0; width: 100%; }
    .st-hero[data-glow="center"] .glow[data-placement="bottom"], .st-hero[data-glow="bottom"] .glow[data-placement="behind"], .st-hero[data-glow="none"] .glow { display: none; }
    .st-phones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; }
    .st-phones figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
    .st-phones .st-tile { height: 504px; min-height: 0; justify-content: center; }
    .st-phones .st-cap { padding: 0; }
    .st-phone-top { position: relative; z-index: 1; align-self: stretch; display: flex; align-items: center; justify-content: space-between; padding: 40px 12px 0; font: 500 8px/1.6 Inter, system-ui, sans-serif; color: #fff; }
    .st-phone-top span { display: flex; align-items: center; gap: 5px; }
    .st-phone-top b { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 12px; font-weight: 400; }
    .st-kb { position: relative; z-index: 1; margin-top: auto; align-self: stretch; padding: 8px 4px 40px; border-radius: 16px 16px 0 0; background: rgba(28,28,28,.86); backdrop-filter: blur(3px); display: flex; flex-direction: column; gap: 6px; }
    .st-kb div { display: flex; gap: 4px; justify-content: center; }
    .st-kb i { flex: 1; height: 28px; border-radius: 7px; background: rgba(255,255,255,.27); display: grid; place-items: center; font: normal 400 14px/1 system-ui, sans-serif; color: #fff; }
    .st-kb i.w { flex: 0 0 56px; font-size: 10px; border-radius: 5px; }
    .st-kb i.s { flex: 0 0 26px; border-radius: 5px; }
    .st-kb .pad { padding: 0 10px; }
    .embed .label { font: var(--text-body-lg-semibold); letter-spacing: var(--text-body-lg-semibold-ls); opacity: 1; color: inherit; margin-bottom: var(--space-4); }
    .embed .row { padding: var(--space-5, 20px); border-radius: var(--radius-md, 16px); background: var(--bg-elevation-5); }
    .embed #title, .embed .label.embed-hide { display: none; }
    .subject { display: flex; align-items: center; justify-content: center; min-height: 8rem; padding: var(--padding-lg); border-radius: var(--radius-md); background: var(--bg-elevation-5); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
    .panel { padding: var(--padding-md); border-radius: var(--radius-md); }
    /* organisms and beyond: one instance, centered, no labels */
    .single main { min-height: calc(100vh - 2 * var(--space-6)); display: flex; flex-direction: column; justify-content: center; }
    .single[data-align="top"] main { justify-content: flex-start; }   /* a card that opens a screen sits at the top (meta "align": "top") */
    .single .label { display: none; }
    .single .subject { display: block; min-height: 0; padding: 0; background: none; border-radius: 0; }
    /* panel thumbnails: just the one variant, centered, not interactive */
    .thumb { padding: 0; pointer-events: none; overflow: hidden; }
    .thumb main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
    .thumb .label { display: none; }
    .thumb .subject { display: flex; justify-content: center; width: 100%; min-height: 0; padding: 0; background: none; border-radius: 0; }
    /* selection overlay (Figma-style): blue hover and selected outlines, corner handles, name tag, size pill */
    #sel-layer { position: fixed; inset: 0; pointer-events: none; z-index: 2147483000; font: 500 10px/1 Inter, system-ui, sans-serif; }
    #sel-layer .box { position: fixed; box-sizing: border-box; border: 1px solid #0d99ff; }
    #sel-layer .box.sel { border-width: 1.5px; }
    #sel-layer .box.slot { border-color: #f0479b; }
    #sel-layer .slot .tag, #sel-layer .slot .dim { background: #f0479b; }
    #sel-layer .slot .h { border-color: #f0479b; }
    #sel-layer .hover.slot .tag { background: none; color: #f0479b; }
    #sel-layer .box[hidden] { display: none; }
    #sel-layer .tag { position: absolute; left: -1px; bottom: 100%; margin-bottom: 3px; padding: 3px 5px; border-radius: 3px; background: #0d99ff; color: #fff; white-space: nowrap; }
    #sel-layer .hover .tag { background: none; color: #0d99ff; padding-left: 0; }
    #sel-layer .h { position: absolute; width: 7px; height: 7px; box-sizing: border-box; background: #fff; border: 1px solid #0d99ff; }
    #sel-layer .tl { left: -4px; top: -4px; } #sel-layer .tr { right: -4px; top: -4px; } #sel-layer .bl { left: -4px; bottom: -4px; } #sel-layer .br { right: -4px; bottom: -4px; }
    #sel-layer .dim { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 7px; padding: 3px 5px; border-radius: 3px; background: #0d99ff; color: #fff; white-space: nowrap; }
    .glyphs { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: var(--space-2); }
    .glyph { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--padding-sm); border-radius: var(--radius-sm); background: var(--bg-elevation-5); text-align: center; overflow: hidden; }
    .glyph span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
<style>body:not([data-ready]) > * { visibility: hidden; }</style>
  <main class="stack" style="--stack-gap: var(--space-8)">
    <section><p class="label text-body-xs text-secondary" id="title">Loading…</p><div class="subject" id="subject"></div></section>
    <div id="gallery" class="stack" style="--stack-gap: var(--space-6)"></div>
  </main>
  <script type="module">
    const path = new URLSearchParams(location.search).get('c');
    const embed = new URLSearchParams(location.search).has('embed');   // inside a sticker sheet: variants only, sized to fit, quiet
    const name = path.split('/').pop();
    const ver = new URLSearchParams(location.search).get('v');
    // data comes from the deploy's one-file bundle when there is one, else from the separate files (local, live editing)
    const dataMod = await import('../tools/data.js' + (ver ? `?v=${ver}` : ''));
    const bundle = await dataMod.loadBundle(ver);
    const meta = bundle && bundle.metas[path] ? bundle.metas[path] : await fetch(`../tds/${path}/${name}.meta.json`, { cache: 'no-store' }).then((r) => r.json());
    const attrs = Object.entries(meta.attributes || {});
    const defaults = Object.fromEntries(attrs.map(([k, a]) => [k, a.default]));
    const examples = meta.examples || [];
    // Composed organisms (states + items + slots) are rendered by tools/compose.js; the panel reads their model back.
    // ?thumb={"state":"provider-cta"} or {"set":{"data-variant":"outline"}}: render just that variant, for the panel's thumbnails.
    const thumbParam = new URLSearchParams(location.search).get('thumb');
    const thumb = thumbParam ? JSON.parse(thumbParam) : null;
    const spec = !!meta.items;   // composed organisms have items (atoms use "states" for hover, pressed, …)
    let compose, ctx, state;
    if (spec) {
      compose = await import('../tools/compose.js' + (ver ? `?v=${ver}` : ''));
      const D = await dataMod.loadData(ver);
      ctx = {
        components: D.metas,
        personas: D.personas,
        environments: D.environments,
        glyphs: D.glyphs.items.map((g) => ({ value: g.name, label: g.name, file: g.file })),
        data: D.sample.variables,
      };
      state = { state: (thumb && thumb.state) || meta.states[0].id, personas: {}, items: {} };
    }
    // Atoms and molecules show every variant at once. Organisms and beyond show one instance; the editor's
    // panel switches variants, state and surface.
    const single = ['organisms', 'patterns', 'screens'].includes(meta.tier);
    document.body.classList.toggle('single', single && !thumb);
    if (meta.align) document.body.dataset.align = meta.align;
    document.body.classList.toggle('thumb', !!thumb);

    function make({ set = {}, state, text, markup } = {}) {
      const t = document.createElement('template'); t.innerHTML = (markup || meta.markup).trim();
      const el = t.content.firstElementChild;
      for (const [k, v] of Object.entries({ ...defaults, ...set })) el.setAttribute(k, v);
      if (state) el.dataset.state = state;
      if (text != null && !el.children.length) el.textContent = text;
      el.setAttribute('data-tds-instance', '');
      return el;
    }
    const section = (title, ...nodes) => {
      const s = document.createElement('section');
      s.innerHTML = `<p class="label text-body-xs text-secondary">${title}</p>`;
      const row = document.createElement('div'); row.className = 'row'; row.append(...nodes); s.append(row); return s;
    };

    // The subject: the one instance the editor's panel controls.
    const slot = document.getElementById('subject');
    const attrState = { ...((thumb && thumb.set) || {}) }; let stateName = '', surfaceState = 'normal', curExample = (thumb && thumb.example) || 0, subject;
    const vars = {};
    const make1 = (markup) => make({ markup: spec ? compose.renderOrganism(meta, state, ctx) : markup, set: attrState, state: stateName || undefined, text: single ? undefined : meta.name });
    const decorate = (el) => { for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v); if (surfaceState === 'inverse') el.dataset.surface = 'inverse'; return el; };
    // A loading card must be exactly as tall as the loaded one so nothing shifts when content arrives: render the loaded
    // card, measure it, and hold the skeleton card at that height (its content flows from the top, the CTA stays at the bottom).
    const build = (markup) => {
      if (!(spec && state.loading)) return make1(markup);
      state.loading = false; const real = decorate(make1(markup)); state.loading = true;
      slot.replaceChildren(real);
      const height = real.getBoundingClientRect().height;
      const el = make1(markup);
      el.style.minHeight = `${height}px`;
      for (const sl of el.querySelectorAll('[data-slot="header"], [data-slot="content"]')) sl.style.alignSelf = 'stretch';   // so a line's % width has something to be a % of
      return el;
    };
    // Figma-style selection for composed organisms. Items are outlined in blue and slots in pink. A slot is a real element
    // (data-slot) that holds its items, so hovering or clicking anywhere in it that isn't an item gives the slot, and an
    // item's slot is one Option-click away.
    const interactive = spec && single && !thumb;
    let sel = null, hov = null, layer = null;   // { kind: 'item' | 'slot', id }
    if (interactive) {
      layer = document.createElement('div'); layer.id = 'sel-layer'; layer.setAttribute('aria-hidden', 'true');
      layer.innerHTML = '<div class="box hover" hidden><span class="tag"></span></div><div class="box sel" hidden><span class="tag"></span><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i><span class="dim"></span></div>';
      document.body.append(layer);
    }
    const elFor = (id) => (id && subject ? subject.querySelector(`[data-item="${id}"]`) : null);
    const slotEl = (id) => (id && subject ? subject.querySelector(`[data-slot="${id}"]`) : null);
    const slotLabels = () => (spec ? compose.getSlots(meta, state) : []);
    const rectOf = (t) => { const el = !t ? null : t.kind === 'slot' ? slotEl(t.id) : elFor(t.id); return el ? el.getBoundingClientRect() : null; };
    const nameOf = (t) => (t.kind === 'slot' ? ((slotLabels().find((x) => x.id === t.id) || {}).label || t.id) : ((meta.items[t.id] && meta.items[t.id].label) || t.id));
    const same = (a, b) => !!a && !!b && a.kind === b.kind && a.id === b.id;
    function drawBox(box, t) {
      const r = rectOf(t); if (!r) { box.hidden = true; return; }
      Object.assign(box.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
      box.classList.toggle('slot', t.kind === 'slot');
      box.querySelector('.tag').textContent = nameOf(t);
      const dim = box.querySelector('.dim'); if (dim) dim.textContent = `${Math.round(r.width)} × ${Math.round(r.height)}`;
      box.hidden = false;
    }
    function drawOverlay() { if (!layer) return; drawBox(layer.querySelector('.hover'), same(hov, sel) ? null : hov); drawBox(layer.querySelector('.sel'), sel); }
    function selectTarget(t) {
      sel = t && rectOf(t) ? { kind: t.kind, id: t.id } : null; drawOverlay();
      if (self !== top && !thumb) parent.postMessage({ type: 'tds-select', kind: sel ? sel.kind : null, id: sel ? sel.id : null }, location.origin);
    }
    function place(el) {
      subject = el; slot.replaceChildren(el);
      for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
      if (surfaceState === 'inverse') el.dataset.surface = 'inverse';   // inverse applies to the component, not the page
      if (layer) { if (sel && !rectOf(sel)) selectTarget(null); else drawOverlay(); }
    }
    document.getElementById('title').textContent = `${meta.name} — ${meta.tier}`;
    if (!(embed && meta.gallery === 'examples')) place(build(examples[curExample] && examples[curExample].markup));   // a designed sheet is only its examples (ids would clash with a hidden copy)

    if (!single && !thumb) {
      const g = document.getElementById('gallery');
      const examplesOnly = meta.gallery === 'examples';   // a sheet made only of designed examples (the blob), not one section per attribute
      if (!examplesOnly) for (const [k, a] of attrs) if (a.type === 'enum') g.append(section(a.when ? `${k} (${Object.values(a.when)[0]} only)` : k, ...a.values.map((v) => make({ set: { ...(a.when || {}), [k]: v }, text: v }))));
      if (!examplesOnly && (meta.states || []).length) g.append(section('states', ...meta.states.map((s) => make({ state: s, text: s }))));
      // An example can carry controls that set attributes on the element inside it: a switch, or radio buttons.
      let ctlId = 0;
      const exampleEl = (ex) => { const t = document.createElement('template'); t.innerHTML = ex.markup.trim(); const el = t.content.firstElementChild; el.setAttribute('data-tds-instance', ''); return el; };
      const controlsFor = (ex, el) => {
        const find = (sel) => (!sel ? null : el.matches(sel) ? el : el.querySelector(sel));
        const box = document.createElement('div'), cols = {}; box.className = 'controls';
        for (const c of ex.controls) {
          const target = find(c.target || ex.target) || el, id = 'ctl' + (++ctlId), row = document.createElement('div'); row.className = 'control';
          if (c.type === 'switch') {
            row.innerHTML = `<label class="text-body-sm"><input type="checkbox" ${(target.getAttribute(c.attr) || c.on) === c.on ? 'checked' : ''}> ${c.label}</label>`;
            row.querySelector('input').addEventListener('change', (e) => target.setAttribute(c.attr, e.target.checked ? c.on : c.off));
          } else if (c.type === 'radio') {
            const vs = c.values.map((v) => (typeof v === 'string' ? { value: v, label: v } : v));
            row.innerHTML = `<p class="text-body-xs text-secondary">${c.label}</p>` + vs.map((v) => `<label class="text-body-sm"><input type="radio" name="${id}" value="${v.value}" ${target.getAttribute(c.attr) === v.value ? 'checked' : ''}> ${v.label}</label>`).join('');
            row.addEventListener('change', (e) => { if (e.target.name === id) target.setAttribute(c.attr, e.target.value); });
          }
          const k = c.col || 1;
          if (!cols[k]) { cols[k] = document.createElement('div'); cols[k].className = 'control-col'; box.append(cols[k]); }
          row.style.gridColumn = k; row.style.gridRow = c.type === 'switch' ? 1 : 2; cols[k].append(row);
        }
        return box;
      };
      for (const ex of examples) {
        if (!examplesOnly) { g.append(section(ex.name, make({ markup: ex.markup }))); continue; }
        // a designed example is its own layout (tiles, captions); it may leave a [data-controls] spot for its controls
        const el = exampleEl(ex), sec = document.createElement('section');
        if (ex.name) sec.innerHTML = `<p class="label">${ex.name}</p>`;
        sec.append(el);
        if (ex.controls) (el.querySelector('[data-controls]') || sec).append(controlsFor(ex, el));
        g.append(sec);
      }
      const first = attrs.find(([, a]) => a.type === 'enum');
      if (first && meta.inverse) {   // only components that really sit on an inverse surface (e.g. icon button, coachmarks) opt in
        const inv = section('on inverse surface', ...first[1].values.map((v) => make({ set: { [first[0]]: v }, text: v })));
        inv.className = 'panel'; inv.dataset.surface = 'inverse'; g.append(inv);
      }
      // Some atoms carry a glyph library (the icon atom): show every glyph.
      if (meta.glyphs) {
        const { items } = (bundle && path === 'atoms/icon') ? bundle.glyphs : await fetch(`../tds/${path}/${meta.glyphs}`, { cache: 'no-store' }).then((r) => r.json());
        const s = document.createElement('section');
        s.innerHTML = `<p class="label text-body-xs text-secondary">${items.length} glyphs</p><div class="glyphs">${items.map((i) => `<div class="glyph"><i class="icon icon-${i.name}"></i><span class="text-body-xs text-secondary">${i.name}</span></div>`).join('')}</div>`;
        g.append(s);
      }
    }

    if (interactive) {
      const inSubject = (el) => el && subject.contains(el);
      const itemAt = (e) => { const el = e.target.closest && e.target.closest('[data-item]'); return inSubject(el) ? el.dataset.item : null; };
      const slotAt = (e) => { const el = e.target.closest && e.target.closest('[data-slot]'); return inSubject(el) ? el.dataset.slot : null; };
      const targetAt = (e) => {
        const id = itemAt(e);
        if (id) { const own = elFor(id).closest('[data-slot]'); return e.altKey && own ? { kind: 'slot', id: own.dataset.slot } : { kind: 'item', id }; }
        const sid = slotAt(e); return sid ? { kind: 'slot', id: sid } : null;
      };
      document.addEventListener('mousemove', (e) => { const t = targetAt(e); if (!same(t, hov)) { hov = t; drawOverlay(); } });
      document.addEventListener('mouseleave', () => { hov = null; drawOverlay(); });
      // Double-click text to edit it where it is. The field in the panel follows every keystroke (and the other way round, the
      // canvas follows the panel). While editing the raw text, {{variables}} included, is shown; it resolves when you finish.
      let editing = null;
      const textField = (id) => {
        const m = compose.getItemModel(meta, state, ctx, id); if (!m) return null;
        if (m.type === 'text') return { prop: null, value: m.value };
        const c = m.controls.find((x) => x.type === 'text'); return c ? { prop: c.key, value: String(c.value) } : null;
      };
      const textNodeOf = (root) => { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.textContent.trim() ? 1 : 3) }); const n = w.nextNode(); return n ? n.parentElement : null; };
      function startEdit(id) {
        if (editing || state.loading) return;
        const f = textField(id), root = elFor(id), node = root && textNodeOf(root); if (!f || !node) return;
        const orig = state.items[id], origText = f.value;
        node.textContent = f.value;
        node.contentEditable = 'plaintext-only'; if (node.contentEditable !== 'plaintext-only') node.contentEditable = 'true';
        Object.assign(node.style, { outline: 'none', cursor: 'text' });
        node.focus(); const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        editing = { id, node };
        const write = (v) => {
          const cur = state.items[id] || {};
          state.items[id] = f.prop ? { ...cur, props: { ...(cur.props || {}), [f.prop]: v } } : { ...cur, value: v, props: cur.props || {} };
          if (self !== top) parent.postMessage({ type: 'tds-edit', id, prop: f.prop, value: v }, location.origin);
          drawOverlay();
        };
        node.addEventListener('input', () => write(node.textContent));
        node.addEventListener('keydown', (e) => {
          e.stopPropagation();
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); node.blur(); editing && editing.finish(); }
          else if (e.key === 'Escape') { e.preventDefault(); if (orig) state.items[id] = orig; else delete state.items[id]; write(origText); node.blur(); editing && editing.finish(); }
        });
        const finish = () => { if (!editing) return; editing = null; node.removeEventListener('blur', finish); place(build()); };
        node.addEventListener('blur', finish);
        editing.finish = finish;
      }
      document.addEventListener('dblclick', (e) => { const id = itemAt(e); if (id) { e.preventDefault(); startEdit(id); } });
      document.addEventListener('click', (e) => { e.preventDefault(); if (editing) { if (editing.node.contains(e.target)) return; editing.finish(); } selectTarget(targetAt(e)); });   // the organism itself or the page = deselect
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !editing) selectTarget(null); });
      addEventListener('resize', drawOverlay); addEventListener('scroll', drawOverlay, true);
    }

    // Driven by the editor (same origin). Nothing here is saved; the editor saves defaults to the repo.
    const all = () => document.querySelectorAll('[data-tds-instance]');
    const contentDefs = () => (examples[curExample] && examples[curExample].content) || meta.content || [];
    const target = (c) => (c.selector === ':scope' ? subject : subject.querySelector(c.selector));
    window.tdsComponent = {
      setAttr(k, v) { attrState[k] = v; subject.setAttribute(k, v); },
      setState(s) { stateName = s; if (s) subject.dataset.state = s; else delete subject.dataset.state; },
      setVar(k, v) { if (v) vars[k] = v; else delete vars[k]; all().forEach((e) => (v ? e.style.setProperty(k, v) : e.style.removeProperty(k))); },
      clearVars() { Object.keys(vars).forEach((k) => this.setVar(k, null)); },
      setExample(i) { if (examples[i]) { curExample = i; place(build(examples[i].markup)); } },
      // composed organisms
      getModel(opts) { return spec ? compose.getModel(meta, state, ctx, opts) : null; },
      getItemModel(id) { return spec ? compose.getItemModel(meta, state, ctx, id) : null; },
      getSlotModel(id) { return spec ? compose.getSlotModel(meta, state, ctx, id) : null; },
      select(id, kind = 'item') { selectTarget(id ? { kind, id } : null); },
      hover(id, kind = 'slot') { hov = id ? { kind, id } : null; drawOverlay(); },   // the panel previews what you point at
      getSelected() { return sel; },
      setVariant(id) { state.state = id; place(build()); },
      setLoading(on) { state.loading = !!on; place(build()); },
      // play the loading state for a moment, then show the content (what the panel's reload button does)
      reload(ms = 1800) { clearTimeout(this._t); state.loading = true; place(build()); this._t = setTimeout(() => { state.loading = false; place(build()); }, ms); return ms; },
      setPersona(role, id) { state.personas[role] = id; place(build()); },
      setItem(id, patch) {
        const cur = state.items[id] || {};
        state.items[id] = { ...cur, ...('value' in patch ? { value: patch.value } : {}), props: { ...(cur.props || {}), ...(patch.props || {}) } };
        place(build());
      },
      setSurface(v) { surfaceState = v; if (v === 'inverse') subject.dataset.surface = 'inverse'; else delete subject.dataset.surface; },
      getContent() { return contentDefs().map((c, i) => { const el = target(c); return { i, label: c.label, value: el ? el.textContent.trim() : '' }; }); },
      setContent(i, v) { const el = contentDefs()[i] && target(contentDefs()[i]); if (el) el.textContent = v; },
      reset() { this.clearVars(); Object.keys(attrState).forEach((k) => delete attrState[k]); stateName = ''; surfaceState = 'normal'; curExample = 0; if (spec) { clearTimeout(this._t); state = { state: meta.states[0].id, personas: {}, items: {} }; } place(build(examples[0] && examples[0].markup)); },
    };
    import('../tds/behaviors/carousel.js' + (ver ? `?v=${ver}` : ''));
    // the blob engine is big (about 80 KB), so it loads only once something on the page needs it: a .blob or a .glow, now or later
    const loadBlob = () => import('../tds/behaviors/blob.js' + (ver ? `?v=${ver}` : ''));
    if (document.querySelector('.blob, .glow')) loadBlob();
    else new MutationObserver((_, ob) => { if (document.querySelector('.blob, .glow')) { ob.disconnect(); loadBlob(); } }).observe(document.documentElement, { childList: true, subtree: true });   // versioned like everything else, so a deploy never mixes old and new
    if (embed) {
      document.body.classList.add('embed');
      // the default instance repeats the first variant, so a sheet only shows it when there are no variants to list
      if (document.getElementById('gallery').children.length) document.getElementById('subject').closest('section').hidden = true;
      // an embedded page never scrolls on its own (a wheel over it must scroll the sheet); it just tells the sheet how tall it is
      document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
      // Things can draw outside their own box (the blob's canvas, shadows, glows). Measure everything that is drawn, push the content in
      // if it pokes out above or to the left, and report a height that includes whatever pokes out below, so nothing is cut off.
      const shift = { x: 0, y: 0 }, PAD = 8;
      const report = () => {
        let top = 0, left = 0, bottom = 0;
        for (const el of document.body.querySelectorAll('*')) {
          if (el.parentElement && el.parentElement.closest('[data-clip]')) continue;   // a clipped tile hides what pokes out of it
          const r = el.getBoundingClientRect(); if (!r.width && !r.height) continue;
          top = Math.min(top, r.top - shift.y); left = Math.min(left, r.left - shift.x); bottom = Math.max(bottom, r.bottom);
        }
        const ny = top < 0 ? Math.ceil(-top) + PAD : 0, nx = left < 0 ? Math.ceil(-left) + PAD : 0;
        if (ny !== shift.y || nx !== shift.x) {
          shift.y = ny; shift.x = nx;
          document.body.style.margin = `${ny}px 0 0 ${nx}px`;
          return report();
        }
        parent.postMessage({ type: 'tds-height', h: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, Math.ceil(bottom) + PAD) }, location.origin);
      };
      const ro = new ResizeObserver(report); ro.observe(document.body); ro.observe(document.documentElement); report();
      addEventListener('load', report); if (document.fonts) document.fonts.ready.then(report);
      document.documentElement.dataset.fidelity = (parent.document.documentElement.dataset.fidelity || 'styled'); document.documentElement.dataset.deviceUi = (parent.document.documentElement.dataset.deviceUi || 'on');
    }
    document.body.dataset.ready = '';   // until now the page shows nothing, not its placeholder
    if (self !== top && !thumb && !embed) parent.postMessage({ type: 'tds-ready', meta }, location.origin);
  </script>
</body>
</html>
