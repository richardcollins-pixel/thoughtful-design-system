<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tds editor</title>
  <style>html, body { margin: 0; height: 100%; background: #ececef; }</style>
</head>
<body>
<script>
/* Loader — keep this file tiny and stable. GitHub Pages lets browsers cache files for ~10 minutes, so
   after a deploy the page, stylesheet and scripts could come from different versions. Instead we read
   the deploy version with a unique URL (so neither the browser nor GitHub's CDN can serve a stale copy), then
   load everything else with that version in its URL. */
(async () => {
  let v;
  try { v = (await (await fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })).json()).v; } catch { v = Date.now(); } // local dev: always fresh
  window.__V = v;
  const q = '?v=' + v;
  const css = (href) => new Promise((done) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href + q; l.onload = l.onerror = done; document.head.append(l);
  });
  const [shell] = await Promise.all([fetch('shell.html' + q).then((r) => r.text()), css('../tds/foundations/fonts.css'), css('editor.css')]);
  document.body.insertAdjacentHTML('afterbegin', shell);
  // version the modules' own imports too
  const map = document.createElement('script'); map.type = 'importmap';
  map.textContent = JSON.stringify({ imports: { './github.js': './github.js' + q, '../tools/build-tokens.js': '../tools/build-tokens.js' + q, '../tools/build-defaults.js': '../tools/build-defaults.js' + q } });
  document.head.append(map);
  import('./editor.js' + q);
})();
</script>
</body>
</html>
