  <div class="app" id="app" data-ui="on">
    <!-- the design: full-screen canvas -->
    <div class="stage" id="stage" hidden><div id="wrap"><div id="frame"><iframe id="screen" title="canvas"></iframe></div></div></div>

    <!-- everything below sits on top of the canvas and hides with ⌘\ -->
    <nav class="float nav" id="nav"></nav>

    <div class="float top" id="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="group" id="toolbar" hidden>
        <select id="device" aria-label="Device"></select>
        <span class="dims"><input id="dw" type="number" min="200" max="3000" aria-label="Width"><span>×</span><input id="dh" type="number" min="200" max="3000" aria-label="Height"></span>
        <i class="sep"></i>
        <label class="switch"><span>Wireframe Mode</span><input type="checkbox" id="t-wire" role="switch"><i></i></label>
      </div>
    </div>

    <main class="float sheet" id="sheet">
      <div class="sheet-head" id="sheethead"><span class="mute" id="sheet-desc"></span><button class="btn" id="add">+ Add token</button></div>
      <div class="center-body" id="body"></div>
    </main>

    <aside class="float panel" id="panel">
      <div class="panel-body" id="panel-body"></div>
      <footer class="savebar" id="savebar" hidden>
        <span class="status" id="status"></span>
        <div class="savebtns">
          <button class="btn" id="signin" hidden>GitHub</button>
          <button class="btn dark" id="commit" hidden>Commit changes</button>
          <button class="btn dark" id="save" hidden>Save</button>
          <button class="btn" id="discard" hidden>Discard</button>
        </div>
      </footer>
    </aside>
  </div>
  <div class="hint" id="hint">⌘\ shows the interface</div>

  <dialog id="dlg"><form method="dialog" class="dlg">
    <h2>GitHub</h2>
    <p class="mute">Edits are saved as commits to the repo. Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a> for this repository with <b>Contents: Read and write</b>. It is kept only in this browser.</p>
    <div class="field"><label>Token</label><input type="text" id="g-token" class="secret" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore></div>
    <div class="field"><label>Repository</label><input id="g-repo" placeholder="owner/repo"></div>
    <div class="field"><label>Branch</label><input id="g-branch"></div>
    <div class="dlg-actions"><button class="btn" value="cancel">Cancel</button><button class="btn dark" value="ok">Save</button></div>
  </form></dialog>
